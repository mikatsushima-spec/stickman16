</style><link rel="manifest" href="./manifest.webmanifest"></head><body><div id="world"><div id="scene"></div><div id="stickLayer"></div></div><div id="aim">＋</div><div id="hud"><div>◷ 残り時間 <span id="time">5:00</span></div><div>● 倒した数 <span id="score">0 / 16</span></div></div><div id="compass">◀ ━━━━━ 180° ━━━━━ ▶</div><div id="radar"><canvas width="200" height="200"></canvas></div><div id="hint">スワイプした方向を見る<br>180°の範囲で探索</div><div id="controls"><div class="joy" id="joy"><span></span></div><div class="actions"><button id="fire">発射</button><button id="scan">◎<br>レーダー</button></div></div><div id="notice"></div><div id="menu"><div id="card"><small>STICKMAN SURVIVAL 16</small><h1>FOOD MARKET</h1><p>カラフルな食品の中に隠れた<br>棒人間16人を探そう！<br>5分以内に全員を見つけよう。</p><button id="start">▶ PLAY</button></div></div><script>
const $=id=>document.getElementById(id);const scene=$('scene'),layer=$('stickLayer');let yaw=0,pitch=0,playing=false,remaining=300,kills=0,used=false,scanUntil=0,last=0,drag=null;
// Four targets are painted in the reference art. Extra game targets are overlaid in matching colors.
// Targets stand on floor or directly on produce displays; none float in empty air.\nconst placements=[
[.105,.348,'#e34b52'],[.34,.326,'#ebcf2d'],[.515,.425,'#4eae55'],[.68,.345,'#ed6573'],
[.77,.305,'#789fe1'],[.89,.375,'#eaa443'],[.185,.53,'#e85850'],[.405,.475,'#e8b64b'],
[.62,.50,'#55a84c'],[.815,.47,'#ec874c'],[.10,.61,'#d65c52'],[.31,.59,'#edc943'],
[.48,.55,'#60b15c'],[.71,.565,'#ec9e4e'],[.89,.56,'#62a45d'],[.56,.35,'#e5c43e']
];
let targets=[];function makeTargets(){layer.innerHTML='';targets=placements.map(([x,y,color],i)=>{const el=document.createElement('div');el.className='stick';el.style.left=(x*100)+'%';el.style.top=(y*100)+'%';let size=.48+(i%4)*.13;el.style.transform='translate(-50%,-50%) scale('+size+')';el.innerHTML='<svg viewBox="0 0 40 80" fill="none" stroke="#182b20" stroke-width="3.5" stroke-linecap="round"><circle cx="20" cy="11" r="9" fill="'+color+'"/><path d="M20 21V48M20 30L5 43M20 30L35 43M20 48L8 72M20 48L32 72" stroke="'+color+'" stroke-width="7"/><path d="M20 21V48M20 30L5 43M20 30L35 43M20 48L8 72M20 48L32 72"/></svg>';layer.append(el);return {x,y,el,alive:true}})}
function applyView(){// Swipe moves the visible scenery in the same direction as the finger.
scene.style.transform='translate('+(-yaw*8)+'%,'+(-pitch*5)+'%) scale(1.16)';layer.style.transform='translate('+(-yaw*8)+'%,'+(-pitch*5)+'%) scale(1.16)';}
function notify(s){$('notice').textContent=s;$('notice').classList.add('on');clearTimeout(notify.t);notify.t=setTimeout(()=>$('notice').classList.remove('on'),1100)}
function fire(){if(!playing)return;const rect=layer.getBoundingClientRect(),centerX=innerWidth/2,centerY=innerHeight/2;let best=null,dist=999;for(const t of targets){if(!t.alive)continue;let x=rect.left+t.x*rect.width,y=rect.top+t.y*rect.height;let d=Math.hypot((x-centerX)/innerWidth,(y-centerY)/innerHeight);if(d<dist){dist=d;best=t}}if(best&&dist<.24){best.alive=false;best.el.remove();kills++;$('score').textContent=kills+' / 16';notify('HIT!  +1');if(kills===16)end(true)}else notify('もう少し近くを狙って！')}
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();fire()});$('scan').onclick=()=>{if(used||!playing)return;used=true;scanUntil=performance.now()+9000;$('scan').disabled=true;notify('レーダー起動 9秒')};
function move(dx,dy){yaw=Math.max(-1,Math.min(1,yaw+dx/innerWidth*1.8));pitch=Math.max(-1,Math.min(1,pitch+dy/innerHeight*2.5));applyView()}
$('world').addEventListener('pointerdown',e=>{if(!playing)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};$('world').setPointerCapture(e.pointerId)});$('world').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;move(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY});$('world').addEventListener('pointerup',()=>drag=null);
$('joy').addEventListener('pointerdown',e=>{e.preventDefault();drag={id:e.pointerId,x:e.clientX,y:e.clientY};$('joy').setPointerCapture(e.pointerId)});$('joy').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;move(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY});$('joy').addEventListener('pointerup',()=>drag=null);
function radar(now){const c=$('radar').querySelector('canvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,200,200);ctx.strokeStyle='#4cce8d';for(let r of [30,60,90]){ctx.beginPath();ctx.arc(100,100,r,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.moveTo(100,0);ctx.lineTo(100,200);ctx.moveTo(0,100);ctx.lineTo(200,100);ctx.stroke();ctx.fillStyle='white';ctx.beginPath();ctx.moveTo(100,92);ctx.lineTo(92,111);ctx.lineTo(108,111);ctx.fill();if(now<scanUntil){ctx.fillStyle='#ff6262';for(const t of targets.filter(x=>x.alive)){ctx.beginPath();ctx.arc(100+(t.x-.5)*155,100+(t.y-.5)*155,4,0,Math.PI*2);ctx.fill()}}}
function end(win){playing=false;$('menu').style.display='grid';$('card').querySelector('h1').textContent=win?'MISSION CLEAR':'TIME UP';$('card').querySelector('p').textContent='発見した棒人間：'+kills+' / 16';$('start').textContent='↻ RETRY'}
$('start').onclick=()=>{makeTargets();yaw=0;pitch=0;applyView();remaining=300;kills=0;used=false;scanUntil=0;$('score').textContent='0 / 16';$('scan').disabled=false;$('menu').style.display='none';playing=true;last=performance.now()};
function frame(now){requestAnimationFrame(frame);if(playing){remaining=Math.max(0,remaining-Math.min(.1,(now-last)/1000));$('time').textContent=Math.floor(remaining/60)+':'+String(Math.floor(remaining%60)).padStart(2,'0');if(remaining===0)end(false)}last=now;radar(now)}requestAnimationFrame(frame);
