*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#173b29;color:white;touch-action:none}#world{position:absolute;inset:0;background:linear-gradient(#80b9e4 0 36%,#9bc46a 36% 57%,#a37c57 57%);overflow:hidden}#park{position:absolute;inset:0;width:100%;height:100%}#targets{position:absolute;inset:0;pointer-events:none}.target{position:absolute;transform:translate(-50%,-50%);width:25px;height:52px;opacity:.64;filter:blur(.45px)}.target svg{width:100%;height:100%}.dead{display:none}#aim{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;text-shadow:0 1px 3px #000;pointer-events:none}#hud{position:absolute;top:12px;left:12px;background:#06150bd9;border-radius:12px;padding:10px;font-weight:800;line-height:1.8}#radarMap{position:absolute;right:12px;top:12px;width:100px;height:100px;border:2px solid #c5ebce;border-radius:50%;background:radial-gradient(circle,#145b39,#031c13);overflow:hidden}#radarMap:after{content:'▲';position:absolute;left:45%;top:42%;color:white}#radarMap i{position:absolute;width:5px;height:5px;border-radius:50%;background:#f55}button{border:2px solid #ffffff77;border-radius:50%;color:white;font-weight:bold;font-size:18px;position:absolute;bottom:22px;width:86px;height:86px;touch-action:manipulation}#fire{right:118px;background:#dc3939}#radar{right:15px;background:#1768c8}#msg{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 4px #000;width:90%}#gun{position:absolute;right:22%;bottom:-18px;width:100px;height:175px;pointer-events:none;transform-origin:bottom center}#gun svg{width:100%;height:100%}#modal{position:absolute;inset:0;background:#000a;display:grid;place-content:center;text-align:center;gap:12px;padding:30px;z-index:5}#start{position:static;border-radius:15px;width:auto;height:auto;padding:15px 28px;background:#2d975e}#view{position:absolute;inset:0;touch-action:none}#tip{font-size:14px;max-width:310px}

"65" y="55" width="20" height="23" rx="3" fill="#e84d32"/></g><g transform="translate(90 390)"><rect width="150" height="16" fill="#775337"/><rect y="20" width="150" height="16" fill="#775337"/><path d="M15 35V75M135 35V75" stroke="#2b3031" stroke-width="9"/></g><g fill="#376e39"><ellipse cx="370" cy="290" rx="80" ry="35"/><ellipse cx="940" cy="350" rx="110" ry="40"/><ellipse cx="50" cy="365" rx="85" ry="40"/></g></svg><div id="view"></div><div id="targets"></div><div id="aim">＋</div><div id="gun"><svg viewBox="0 0 100 175"><path d="M40 8L65 8L77 98L64 130L83 175H36L32 110Z" fill="#30343b" stroke="#101316" stroke-width="5"/><path d="M41 8H65V20H41Z" fill="#717780"/><path d="M37 98L75 98" stroke="#111" stroke-width="10"/></svg></div></div><div id="hud">⏱ 残り時間 <span id="time">5:00</span><div>◎ 倒した数 <span id="score">0</span> / 16</div></div><div id="radarMap"></div><div id="msg">背景に隠れた棒人間を探そう</div><button id="fire">発射</button><button id="radar">レーダー</button><div id="modal"><h1>スティックマン16</h1><p>公園に隠れた棒人間を5分で16人探そう！</p><p id="tip">画面を指で動かして銃の照準を合わせ、発射。レーダーは1回だけ9秒間使えます。</p><button id="start">ゲーム開始 ▶</button></div><script>
(()=>{const $=id=>document.getElementById(id),area=$('view'),aim=$('aim'),gun=$('gun');let targets=[],remaining=300,score=0,active=false,last=0,radarUntil=0,used=false,ax=.5,ay=.5;const spots=[[.06,.48],[.14,.37],[.23,.46],[.31,.55],[.37,.38],[.43,.45],[.48,.59],[.54,.41],[.61,.55],[.68,.38],[.74,.51],[.81,.43],[.88,.53],[.94,.37],[.28,.65],[.57,.7]];function setup(){targets=[];$('targets').innerHTML='';spots.forEach(([x,y],i)=>{let e=document.createElement('div');e.className='target';e.style.left=x*100+'%';e.style.top=y*100+'%';e.style.opacity=[.43,.52,.6,.7][i%4];e.innerHTML='<svg viewBox="0 0 30 65"><circle cx="15" cy="10" r="7" fill="#3a5233" stroke="#263f27" stroke-width="2.5"/><path d="M15 18V43M15 25L4 37M15 25L27 36M15 43L5 60M15 43L27 60" stroke="#354c31" stroke-width="3.3" fill="none" stroke-linecap="round"/></svg>';$('targets').append(e);targets.push({x,y,e,alive:true})})}function hud(){$('time').textContent=Math.floor(remaining/60)+':'+String(Math.floor(remaining%60)).padStart(2,'0');$('score').textContent=score}function msg(s){$('msg').textContent=s}function finish(win){active=false;$('modal').style.display='grid';$('modal').querySelector('h1').textContent=win?'全員発見！':'時間切れ！';$('modal').querySelector('p').textContent='発見 '+score+' / 16';$('start').textContent='もう一度 ▶'}function move(x,y){let r=area.getBoundingClientRect();ax=Math.max(.02,Math.min(.98,(x-r.left)/r.width));ay=Math.max(.15,Math.min(.9,(y-r.top)/r.height));aim.style.left=ax*100+'%';aim.style.top=ay*100+'%';gun.style.transform='rotate('+((ax-.5)*22)+'deg)'}area.addEventListener('pointerdown',e=>{if(active){area.setPointerCapture(e.pointerId);move(e.clientX,e.clientY)}});area.addEventListener('pointermove',e=>{if(active&&e.buttons)move(e.clientX,e.clientY)});$('fire').addEventListener('pointerdown',e=>{e.preventDefault();if(!active)return;let hit=null,d=.048;for(let t of targets){if(!t.alive)continue;let dist=Math.hypot((ax-t.x)*1.6,ay-t.y);if(dist<d){d=dist;hit=t}}if(hit){hit.alive=false;hit.e.classList.add('dead');score++;msg('命中！ '+score+'/16');if(score===16)finish(true)}else msg('はずれ！');hud();radar()});function radar(){$('radarMap').querySelectorAll('i').forEach(e=>e.remove());if(performance.now()<radarUntil)targets.filter(t=>t.alive).forEach(t=>{let i=document.createElement('i');i.style.left=t.x*90+5+'%';i.style.top=t.y*90+5+'%';$('radarMap').append(i)})}$('radar').onclick=()=>{if(!active||used)return;used=true;radarUntil=performance.now()+9000;radar();$('radar').style.opacity=.5;msg('レーダー起動！')};$('start').onclick=()=>{remaining=300;score=0;active=true;used=false;radarUntil=0;last=performance.now();$('radar').style.opacity=1;$('modal').style.display='none';setup();hud();radar();msg('棒人間を探そう！')};function tick(now){requestAnimationFrame(tick);if(!active)return;remaining=Math.max(0,remaining-(now-last)/1000);last=now;hud();if(remaining<=0)finish(false);if(radarUntil&&now>radarUntil){radarUntil=0;radar();msg('レーダー終了')}}requestAnimationFrame(tick);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
