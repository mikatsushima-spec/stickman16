function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000||0);last=now;if(playing){time=Math.max(0,time-dt);$('clock').textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(Math.floor(time%60)).padStart(2,'0');if(time===0)end(false);if(playing&&(joy.x||joy.y)){const speed=3.2*dt;let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let next=camera.position.clone().addScaledVector(right,joy.x*speed).addScaledVector(forward,-joy.y*speed);let nx=Math.max(-9.7,Math.min(9.7,next.x)),nz=Math.max(-8.7,Math.min(7.9,next.z));if(clearWalk(nx,camera.position.z))camera.position.x=nx;if(clearWalk(camera.position.x,nz))camera.position.z=nz}}if(radarUntil){if(now<radarUntil)drawRadar();else{radarUntil=0;$('radarCanvas').style.display='none'}}renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.__gameReady=true;clearTimeout(window.__gameStartupWatch);$('loading').remove();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
